<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study 03 — The Gap Is In The Environment</title>
<link href="https://fonts.googleapis.com/css2?family=ASAP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'ASAP', sans-serif; background: #fff; color: #303e44; max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem; }
  .cs-num { display: inline-block; background: #475f6a; color: #fff; font-size: 10px; font-weight: 600; border-radius: 3px; padding: 1px 7px; margin-right: 8px; }
  .cs-title { font-size: 15px; font-weight: 600; color: #303e44; margin-bottom: 6px; }
  .label-row { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .08em; color: #475f6a; font-weight: 500; text-transform: uppercase; margin-bottom: 4px; }
  .wrap { position: relative; width: 100%; aspect-ratio: 640 / 380; overflow: hidden; cursor: col-resize; user-select: none; border-radius: 8px; border: .5px solid #c8d4d8; }
  .panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .after-panel { clip-path: inset(0 50% 0 0); }
  .divider-line { position: absolute; top: 0; left: 50%; width: 1.5px; height: 100%; background: #475f6a; pointer-events: none; }
  .handle { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1.5px solid #475f6a; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 14px; color: #475f6a; }
  .hint { text-align: center; font-size: 11px; color: #7a9aaa; padding-top: 6px; }
  text { font-family: 'ASAP', sans-serif; }
</style>
</head>
<body>

<p class="cs-title"><span class="cs-num">03</span>The gap is in the environment</p>
<div class="label-row"><span>← Before</span><span>After →</span></div>
<div class="wrap" id="wrap">

  <svg class="panel" viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>Before: gaps between a person and their environment create friction and waiting</title>
    <rect width="640" height="380" fill="#edf2f4"/>
    <text x="320" y="28" text-anchor="middle" font-size="12" fill="#475f6a" letter-spacing="1" font-weight="500">the gap is in the environment</text>
    <circle cx="320" cy="195" r="38" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="320" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">graduate</text>
    <text x="320" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">student</text>
    <rect x="248" y="46" width="144" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6" opacity=".45"/>
    <text x="320" y="62" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44" opacity=".5">thesis work</text>
    <line x1="320" y1="157" x2="320" y2="80" stroke="#475f6a" stroke-width=".6" stroke-dasharray="4 4"/>
    <rect x="54" y="180" width="130" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6" opacity=".45"/>
    <text x="119" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44" opacity=".5">HCA</text>
    <line x1="282" y1="195" x2="186" y2="195" stroke="#475f6a" stroke-width=".6" stroke-dasharray="4 4"/>
    <rect x="456" y="180" width="130" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6" opacity=".45"/>
    <text x="521" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44" opacity=".5">daily needs</text>
    <line x1="358" y1="195" x2="454" y2="195" stroke="#475f6a" stroke-width=".6" stroke-dasharray="4 4"/>
    <rect x="92" y="294" width="140" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6" opacity=".45"/>
    <text x="162" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44" opacity=".5">night hours</text>
    <line x1="296" y1="222" x2="206" y2="292" stroke="#475f6a" stroke-width=".6" stroke-dasharray="4 4"/>
    <rect x="408" y="294" width="140" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6" opacity=".45"/>
    <text x="478" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44" opacity=".5">shift changes</text>
    <line x1="344" y1="222" x2="436" y2="292" stroke="#475f6a" stroke-width=".6" stroke-dasharray="4 4"/>
    <text x="320" y="350" text-anchor="middle" font-size="11" fill="#6a8a94">inadequate tools · friction · waiting · needs unmet or met late</text>
  </svg>

  <svg class="panel after-panel" id="after" viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>After: a zero-cost communication tool designed by the person closes every gap</title>
    <defs>
      <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#475f6a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <rect width="640" height="380" fill="#fff"/>
    <text x="320" y="28" text-anchor="middle" font-size="12" fill="#475f6a" letter-spacing="1" font-weight="500">the tool closes the gap</text>
    <line x1="320" y1="157" x2="320" y2="80" stroke="#475f6a" stroke-width=".6" marker-end="url(#ab)"/>
    <line x1="282" y1="195" x2="186" y2="195" stroke="#475f6a" stroke-width=".6" marker-end="url(#ab)"/>
    <line x1="358" y1="195" x2="454" y2="195" stroke="#475f6a" stroke-width=".6" marker-end="url(#ab)"/>
    <line x1="296" y1="222" x2="206" y2="292" stroke="#475f6a" stroke-width=".6" marker-end="url(#ab)"/>
    <line x1="344" y1="222" x2="436" y2="292" stroke="#475f6a" stroke-width=".6" marker-end="url(#ab)"/>
    <circle cx="320" cy="195" r="38" fill="#d6e8ec" stroke="#475f6a" stroke-width=".8"/>
    <text x="320" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#303e44">graduate</text>
    <text x="320" y="200" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#303e44">student</text>
    <text x="320" y="216" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#475f6a">+ their tool</text>
    <rect x="248" y="46" width="144" height="32" rx="4" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="320" y="62" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">thesis work</text>
    <rect x="54" y="180" width="130" height="32" rx="4" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="119" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">care aids</text>
    <rect x="456" y="180" width="130" height="32" rx="4" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="521" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">daily needs</text>
    <rect x="92" y="294" width="140" height="32" rx="4" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="162" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">night hours</text>
    <rect x="408" y="294" width="140" height="32" rx="4" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="478" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">shift changes</text>
    <text x="320" y="350" text-anchor="middle" font-size="11" fill="#475f6a">zero cost · no technology · designed by the person · works in any context</text>
  </svg>

  <div class="divider-line" id="divider"></div>
  <div class="handle" id="handle">‹›</div>
</div>
<p class="hint">drag to compare</p>

<script>
  const wrap=document.getElementById('wrap'),after=document.getElementById('after'),divider=document.getElementById('divider'),handle=document.getElementById('handle');
  let dragging=false;
  function setPos(x){const r=wrap.getBoundingClientRect(),p=Math.max(4,Math.min(96,((x-r.left)/r.width)*100));after.style.clipPath='inset(0 '+(100-p)+'% 0 0)';divider.style.left=p+'%';handle.style.left=p+'%';}
  wrap.addEventListener('mousedown',e=>{dragging=true;setPos(e.clientX);});
  window.addEventListener('mousemove',e=>{if(dragging)setPos(e.clientX);});
  window.addEventListener('mouseup',()=>{dragging=false;});
  wrap.addEventListener('touchstart',e=>{dragging=true;setPos(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchmove',e=>{if(dragging)setPos(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchend',()=>{dragging=false;});
</script>
</body>
</html>
