
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Asap', sans-serif; background: transparent; }
.wrap-outer { max-width: 680px; padding: 0.75rem 0; user-select: none; }
.col-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #8aa4ae;
  margin-bottom: 6px;
}
.slider-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 640 / 400;
  overflow: hidden;
  cursor: ew-resize;
  border-radius: 10px;
}
.panel {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
.after-panel { clip-path: inset(0 50% 0 0); }
.divider {
  position: absolute;
  top: 0; left: 50%;
  width: 2px; height: 100%;
  background: white;
  pointer-events: none;
  transform: translateX(-50%);
}
.handle {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 36px; height: 36px;
  border-radius: 50%;
  background: white;
  border: 2px solid #475f6a;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.hint {
  text-align: center;
  font-size: 11px;
  color: #8aa4ae;
  font-family: 'Asap', sans-serif;
  margin-top: 8px;
}
</style>

<div class="wrap-outer">
  <div class="col-labels">
    <span>Before: isolated, inconsistent</span>
    <span>After: connected, equity-informed</span>
  </div>

  <div class="slider-wrap" id="slider">

    <!-- BEFORE panel -->
    <svg class="panel" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="640" height="400" fill="#303e44"/>

      <!-- Outer ring -->
      <circle cx="320" cy="200" r="178" fill="none" stroke="#475f6a" stroke-width="1.5" stroke-dasharray="6 5"/>
      <!-- Middle ring -->
      <circle cx="320" cy="200" r="112" fill="none" stroke="#475f6a" stroke-width="1.5" stroke-dasharray="4 4"/>
      <!-- Inner ring -->
      <circle cx="320" cy="200" r="52" fill="none" stroke="#475f6a" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Outer ring label -->
      <text text-anchor="middle" font-family="Asap, sans-serif">
        <tspan x="320" y="30" font-size="12" font-weight="600" fill="#7fa0aa">900+ CAMPUS EMPLOYERS</tspan>
        <tspan x="320" dy="18" font-size="11" fill="#4e6870">inconsistent onboarding practices</tspan>
      </text>

      <!-- Middle ring label — positioned above inner ring -->
      <text text-anchor="middle" font-family="Asap, sans-serif">
        <tspan x="320" y="108" font-size="11" font-weight="600" fill="#7fa0aa">PUBLIC-FACING LEARNING INSTITUTION</tspan>
        <tspan x="320" dy="16" font-size="10.5" fill="#4e6870">no shared processes</tspan>
      </text>

      <!-- Inner ring label -->
      <text text-anchor="middle" font-family="Asap, sans-serif">
        <tspan x="320" y="195" font-size="11" font-weight="600" fill="#7fa0aa">15+ STUDENT STAFF</tspan>
        <tspan x="320" dy="16" font-size="10.5" fill="#4e6870">unsupported</tspan>
      </text>

      <!-- Bottom caption -->
      <text x="320" y="382" text-anchor="middle" font-family="Asap, sans-serif" font-size="10.5" font-style="italic" fill="#4e6870">
        good intentions · technical eligibility · isolated front-line roles
      </text>
    </svg>

    <!-- AFTER panel -->
    <svg class="panel after-panel" id="after-panel" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="640" height="400" fill="#f5f7f8"/>

      <!-- Outer ring filled -->
      <circle cx="320" cy="200" r="178" fill="#e8f0f3" stroke="#475f6a" stroke-width="1.5"/>
      <!-- Middle ring filled -->
      <circle cx="320" cy="200" r="112" fill="#d0dde2" stroke="#475f6a" stroke-width="1.5"/>
      <!-- Inner ring filled -->
      <circle cx="320" cy="200" r="52" fill="#ffffff" stroke="#475f6a" stroke-width="1.5"/>

      <!-- Outer ring label -->
      <text text-anchor="middle" font-family="Asap, sans-serif">
        <tspan x="320" y="30" font-size="12" font-weight="600" fill="#303e44">900+ CAMPUS EMPLOYERS</tspan>
        <tspan x="320" dy="17" font-size="11" fill="#475f6a">accessible onboarding · equity evaluation · $6M+ grants</tspan>
      </text>

      <!-- Middle ring label -->
      <text text-anchor="middle" font-family="Asap, sans-serif">
        <tspan x="320" y="112" font-size="11" font-weight="600" fill="#303e44">PUBLIC-FACING LEARNING INSTITUTION</tspan>
        <tspan x="320" dy="16" font-size="10.5" fill="#475f6a">social safety net awareness · equity &amp; inclusion pilot</tspan>
      </text>

      <!-- Inner ring label -->
      <text text-anchor="middle" font-family="Asap, sans-serif">
        <tspan x="320" y="195" font-size="11" font-weight="600" fill="#303e44">15+ STUDENT STAFF</tspan>
        <tspan x="320" dy="16" font-size="10.5" fill="#475f6a">wellness liaison · shared processes</tspan>
      </text>

      <!-- Bottom caption -->
      <text x="320" y="382" text-anchor="middle" font-family="Asap, sans-serif" font-size="10.5" font-style="italic" fill="#6b8a94">
        shared infrastructure · meaningful inclusion · supported practitioners
      </text>
    </svg>

    <div class="divider" id="divider"></div>
    <div class="handle" id="handle">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M5 4L1 8L5 12M11 4L15 8L11 12" stroke="#475f6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <p class="hint">← drag to compare →</p>
</div>

<script>
const slider   = document.getElementById('slider');
const after    = document.getElementById('after-panel');
const divider  = document.getElementById('divider');
const handle   = document.getElementById('handle');
let dragging   = false;

function setPos(x) {
  const r = slider.getBoundingClientRect();
  const p = Math.max(4, Math.min(96, ((x - r.left) / r.width) * 100));
  after.style.clipPath = `inset(0 ${100 - p}% 0 0)`;
  divider.style.left   = p + '%';
  handle.style.left    = p + '%';
}

slider.addEventListener('mousedown',  e => { dragging = true; setPos(e.clientX); });
window.addEventListener('mousemove',  e => { if (dragging) setPos(e.clientX); });
window.addEventListener('mouseup',    () => { dragging = false; });
slider.addEventListener('touchstart', e => { dragging = true; setPos(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchmove',  e => { if (dragging) setPos(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchend',   () => { dragging = false; });
</script>
