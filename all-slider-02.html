<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study 02 — Carrying It Alone</title>
<link href="https://fonts.googleapis.com/css2?family=ASAP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'ASAP', sans-serif; background: #fff; color: #303e44; max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem; }
  .cs-num { display: inline-block; background: #475f6a; color: #fff; font-size: 10px; font-weight: 600; border-radius: 3px; padding: 1px 7px; margin-right: 8px; }
  .cs-title { font-size: 15px; font-weight: 600; color: #303e44; margin-bottom: 6px; }
  .label-row { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .08em; color: #475f6a; font-weight: 500; text-transform: uppercase; margin-bottom: 4px; }
  .wrap { position: relative; width: 100%; aspect-ratio: 640 / 380; overflow: hidden; cursor: col-resize; user-select: none; border-radius: 8px; border: .5px solid #c8d4d8; }
  .panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .after-panel { clip-path: inset(0 50% 0 0); }
  .divider-line { position: absolute; top: 0; left: 50%; width: 1.5px; height: 100%; background: #475f6a; pointer-events: none; }
  .handle { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1.5px solid #475f6a; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 14px; color: #475f6a; }
  .hint { text-align: center; font-size: 11px; color: #7a9aaa; padding-top: 6px; }
  text { font-family: 'ASAP', sans-serif; }
</style>
</head>
<body>

<p class="cs-title"><span class="cs-num">02</span>Carrying it alone</p>
<div class="label-row"><span>← Before</span><span>After →</span></div>
<div class="wrap" id="wrap">

  <svg class="panel" viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img">

    <rect width="640" height="380" fill="#edf2f4"/>

    <circle cx="130" cy="100" r="30" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="130" y="96" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">family</text>
    <text x="130" y="110" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">member</text>
    <circle cx="510" cy="100" r="30" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="510" y="96" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">family</text>
    <text x="510" y="110" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">member</text>
    <circle cx="100" cy="210" r="30" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="100" y="206" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">informal</text>
    <text x="100" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">carer</text>
    <circle cx="540" cy="210" r="30" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="540" y="206" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">informal</text>
    <text x="540" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">carer</text>
    <circle cx="180" cy="310" r="30" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="180" y="306" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">community</text>
    <text x="180" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">member</text>
    <circle cx="460" cy="310" r="30" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="460" y="306" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">community</text>
    <text x="460" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">member</text>
    <text x="320" y="350" text-anchor="middle" font-size="11" fill="#6a8a94">knowledge held alone · grief carried alone · decisions made under urgency</text>
  </svg>

  <svg class="panel after-panel" id="after" viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>After: people connected through shared knowledge and peer support</title>
    <rect width="640" height="380" fill="#fff"/>
    <text x="320" y="28" text-anchor="middle" font-size="12" fill="#475f6a" letter-spacing="1" font-weight="500">decisions made with dignity</text>

    <line x1="482" y1="107" x2="353" y2="185" stroke="#475f6a" stroke-width=".6"/>
    <line x1="129" y1="210" x2="280" y2="202" stroke="#475f6a" stroke-width=".6"/>
    <line x1="511" y1="210" x2="360" y2="202" stroke="#475f6a" stroke-width=".6"/>
    <line x1="205" y1="305" x2="290" y2="228" stroke="#475f6a" stroke-width=".6"/>
    <line x1="435" y1="305" x2="350" y2="228" stroke="#475f6a" stroke-width=".6"/>
    <line x1="158" y1="100" x2="482" y2="100" stroke="#475f6a" stroke-width=".4" opacity=".25"/>
    <line x1="130" y1="210" x2="510" y2="210" stroke="#475f6a" stroke-width=".4" opacity=".25"/>
    <line x1="205" y1="310" x2="435" y2="310" stroke="#475f6a" stroke-width=".4" opacity=".25"/>
    <circle cx="320" cy="205" r="50" fill="#d6e8ec" stroke="#475f6a" stroke-width=".8"/>
    <text x="320" y="195" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#303e44">shared space</text>
    <text x="320" y="211" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475f6a">meal · peers</text>
    <text x="320" y="226" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475f6a">grief support</text>
    <circle cx="130" cy="100" r="30" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="130" y="96" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">family</text>
    <text x="130" y="110" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">member</text>
    <circle cx="510" cy="100" r="30" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="510" y="96" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">family</text>
    <text x="510" y="110" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">member</text>
    <circle cx="100" cy="210" r="30" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="100" y="206" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">informal</text>
    <text x="100" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">carer</text>
    <circle cx="540" cy="210" r="30" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="540" y="206" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">informal</text>
    <text x="540" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">carer</text>
    <circle cx="180" cy="310" r="30" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="180" y="306" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">community</text>
    <text x="180" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">member</text>
    <circle cx="460" cy="310" r="30" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="460" y="306" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">community</text>
    <text x="460" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#303e44">member</text>
    <text x="320" y="350" text-anchor="middle" font-size="11" fill="#475f6a">knowledge shared · grief held together · decisions made with dignity</text>
  </svg>

  <div class="divider-line" id="divider"></div>
  <div class="handle" id="handle">‹›</div>
</div>
<p class="hint">drag to compare</p>

<script>
  const wrap=document.getElementById('wrap'),after=document.getElementById('after'),divider=document.getElementById('divider'),handle=document.getElementById('handle');
  let dragging=false;
  function setPos(x){const r=wrap.getBoundingClientRect(),p=Math.max(4,Math.min(96,((x-r.left)/r.width)*100));after.style.clipPath='inset(0 '+(100-p)+'% 0 0)';divider.style.left=p+'%';handle.style.left=p+'%';}
  wrap.addEventListener('mousedown',e=>{dragging=true;setPos(e.clientX);});
  window.addEventListener('mousemove',e=>{if(dragging)setPos(e.clientX);});
  window.addEventListener('mouseup',()=>{dragging=false;});
  wrap.addEventListener('touchstart',e=>{dragging=true;setPos(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchmove',e=>{if(dragging)setPos(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchend',()=>{dragging=false;});
</script>
</body>
</html>
