<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study 02 — Carrying It Alone</title>
<link href="https://fonts.googleapis.com/css2?family=ASAP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'ASAP', sans-serif; background: #fff; color: #303e44; max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem; }
  .cs-num { display: inline-block; background: #475f6a; color: #fff; font-size: 10px; font-weight: 600; border-radius: 3px; padding: 1px 7px; margin-right: 8px; }
  .cs-title { font-size: 15px; font-weight: 600; color: #303e44; margin-bottom: 6px; }
  .label-row { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .08em; color: #475f6a; font-weight: 500; text-transform: uppercase; margin-bottom: 4px; }
  .wrap { position: relative; width: 100%; aspect-ratio: 640 / 420; overflow: hidden; cursor: col-resize; user-select: none; border-radius: 8px; border: .5px solid #c8d4d8; }
  .panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .after-panel { clip-path: inset(0 50% 0 0); }
  .divider-line { position: absolute; top: 0; left: 50%; width: 1.5px; height: 100%; background: #475f6a; pointer-events: none; }
  .handle { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1.5px solid #475f6a; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 14px; color: #475f6a; }
  .hint { text-align: center; font-size: 11px; color: #7a9aaa; padding-top: 6px; }
  text { font-family: 'ASAP', sans-serif; }
</style>
</head>
<body>

<p class="cs-title"><span class="cs-num">02</span>Carrying it alone</p>
<div class="label-row"><span>← Before</span><span>After →</span></div>
<div class="wrap" id="wrap">

  <!-- BEFORE -->
  <svg class="panel" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>Before: people isolated, carrying knowledge and grief alone</title>
    <rect width="640" height="420" fill="#edf2f4"/>
    <text x="320" y="28" text-anchor="middle" font-size="12" fill="#475f6a" letter-spacing="1" font-weight="500">knowledge held alone</text>

    <!-- Top row -->
    <circle cx="145" cy="105" r="38" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="145" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">family</text>
    <text x="145" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">member</text>

    <circle cx="495" cy="105" r="38" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="495" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">family</text>
    <text x="495" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">member</text>

    <!-- Middle row -->
    <circle cx="145" cy="225" r="38" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="145" y="219" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">informal</text>
    <text x="145" y="235" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">carer</text>

    <circle cx="495" cy="225" r="38" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="495" y="219" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">informal</text>
    <text x="495" y="235" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">carer</text>

    <!-- Bottom row -->
    <circle cx="145" cy="345" r="38" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="145" y="339" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">community</text>
    <text x="145" y="355" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">member</text>

    <circle cx="495" cy="345" r="38" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="495" y="339" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">community</text>
    <text x="495" y="355" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">member</text>

    <text x="320" y="400" text-anchor="middle" font-size="11" fill="#6a8a94">knowledge held alone · grief carried alone · decisions made under urgency</text>
  </svg>

  <!-- AFTER -->
  <svg class="panel after-panel" id="after" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>After: people connected through shared knowledge and peer support</title>
    <rect width="640" height="420" fill="#fff"/>
    <text x="320" y="28" text-anchor="middle" font-size="12" fill="#475f6a" letter-spacing="1" font-weight="500">decisions made with dignity</text>

    <!-- Connector lines to centre hub -->
    <line x1="181" y1="115" x2="274" y2="188" stroke="#475f6a" stroke-width=".6"/>
    <line x1="459" y1="115" x2="366" y2="188" stroke="#475f6a" stroke-width=".6"/>
    <line x1="183" y1="225" x2="278" y2="218" stroke="#475f6a" stroke-width=".6"/>
    <line x1="457" y1="225" x2="362" y2="218" stroke="#475f6a" stroke-width=".6"/>
    <line x1="178" y1="320" x2="278" y2="248" stroke="#475f6a" stroke-width=".6"/>
    <line x1="462" y1="320" x2="362" y2="248" stroke="#475f6a" stroke-width=".6"/>

    <!-- Faint horizontal peer lines -->
    <line x1="183" y1="105" x2="457" y2="105" stroke="#475f6a" stroke-width=".4" opacity=".2"/>
    <line x1="183" y1="225" x2="457" y2="225" stroke="#475f6a" stroke-width=".4" opacity=".2"/>
    <line x1="183" y1="345" x2="457" y2="345" stroke="#475f6a" stroke-width=".4" opacity=".2"/>

    <!-- Centre hub -->
    <circle cx="320" cy="218" r="58" fill="#d6e8ec" stroke="#475f6a" stroke-width=".8"/>
    <text x="320" y="204" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#303e44">shared space</text>
    <text x="320" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475f6a">meal · peers</text>
    <text x="320" y="238" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475f6a">grief support</text>

    <!-- Top row -->
    <circle cx="145" cy="105" r="38" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="145" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">family</text>
    <text x="145" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">member</text>

    <circle cx="495" cy="105" r="38" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="495" y="99" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">family</text>
    <text x="495" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">member</text>

    <!-- Middle row -->
    <circle cx="145" cy="225" r="38" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="145" y="219" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">informal</text>
    <text x="145" y="235" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">carer</text>

    <circle cx="495" cy="225" r="38" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="495" y="219" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">informal</text>
    <text x="495" y="235" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">carer</text>

    <!-- Bottom row -->
    <circle cx="145" cy="345" r="38" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="145" y="339" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">community</text>
    <text x="145" y="355" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">member</text>

    <circle cx="495" cy="345" r="38" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="495" y="339" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">community</text>
    <text x="495" y="355" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#303e44">member</text>

    <text x="320" y="400" text-anchor="middle" font-size="11" fill="#475f6a">knowledge shared · grief held together · decisions made with dignity</text>
  </svg>

  <div class="divider-line" id="divider"></div>
  <div class="handle" id="handle">‹›</div>
</div>
<p class="hint">drag to compare</p>

<script>
  const wrap=document.getElementById('wrap'),after=document.getElementById('after'),divider=document.getElementById('divider'),handle=document.getElementById('handle');
  let dragging=false;
  function setPos(x){const r=wrap.getBoundingClientRect(),p=Math.max(4,Math.min(96,((x-r.left)/r.width)*100));after.style.clipPath='inset(0 '+(100-p)+'% 0 0)';divider.style.left=p+'%';handle.style.left=p+'%';}
  wrap.addEventListener('mousedown',e=>{dragging=true;setPos(e.clientX);});
  window.addEventListener('mousemove',e=>{if(dragging)setPos(e.clientX);});
  window.addEventListener('mouseup',()=>{dragging=false;});
  wrap.addEventListener('touchstart',e=>{dragging=true;setPos(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchmove',e=>{if(dragging)setPos(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchend',()=>{dragging=false;});
</script>
</body>
</html>
