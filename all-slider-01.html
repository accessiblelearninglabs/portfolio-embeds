<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study 01 — When Infrastructure Fails</title>
<link href="https://fonts.googleapis.com/css2?family=ASAP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'ASAP', sans-serif; background: #fff; color: #303e44; max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem; }
  .cs-num { display: inline-block; background: #475f6a; color: #fff; font-size: 10px; font-weight: 600; border-radius: 3px; padding: 1px 7px; margin-right: 8px; }
  .cs-title { font-size: 15px; font-weight: 600; color: #303e44; margin-bottom: 6px; }
  .label-row { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .08em; color: #475f6a; font-weight: 500; text-transform: uppercase; margin-bottom: 4px; }
  .wrap { position: relative; width: 100%; aspect-ratio: 640 / 380; overflow: hidden; cursor: col-resize; user-select: none; border-radius: 8px; border: .5px solid #c8d4d8; }
  .panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .after-panel { clip-path: inset(0 50% 0 0); }
  .divider-line { position: absolute; top: 0; left: 50%; width: 1.5px; height: 100%; background: #475f6a; pointer-events: none; }
  .handle { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1.5px solid #475f6a; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 14px; color: #475f6a; }
  .hint { text-align: center; font-size: 11px; color: #7a9aaa; padding-top: 6px; }
  text { font-family: 'ASAP', sans-serif; }
</style>
</head>
<body>

<p class="cs-title"><span class="cs-num">01</span>When infrastructure fails</p>
<div class="label-row"><span>← Before</span><span>After →</span></div>
<div class="wrap" id="wrap">

  <svg class="panel" viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>Before: infrastructure collapses, information severs</title>
    <rect width="640" height="380" fill="#edf2f4"/>
    <text x="320" y="28" text-anchor="middle" font-size="12" fill="#475f6a" letter-spacing="1" font-weight="500">when infrastructure collapses</text>
    <rect x="30" y="55" width="148" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="104" y="71" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">civilians</text>
    <rect x="30" y="98" width="148" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="104" y="114" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">displaced people</text>
    <rect x="30" y="141" width="148" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="104" y="157" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">aid workers</text>
    <rect x="30" y="184" width="148" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6"/>
    <text x="104" y="200" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">community leaders</text>
    <rect x="210" y="55" width="210" height="170" rx="6" fill="none" stroke="#475f6a" stroke-width=".8" stroke-dasharray="5 4"/>
    <text x="315" y="125" text-anchor="middle" font-size="22" fill="#b04040">✕</text>
    <text x="315" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#6a8a94">infrastructure</text>
    <text x="315" y="168" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#6a8a94">collapsed</text>
    <line x1="180" y1="71" x2="208" y2="95" stroke="#475f6a" stroke-width=".6" stroke-dasharray="3 4"/>
    <line x1="180" y1="114" x2="208" y2="120" stroke="#475f6a" stroke-width=".6" stroke-dasharray="3 4"/>
    <line x1="180" y1="157" x2="208" y2="148" stroke="#475f6a" stroke-width=".6" stroke-dasharray="3 4"/>
    <line x1="180" y1="200" x2="208" y2="176" stroke="#475f6a" stroke-width=".6" stroke-dasharray="3 4"/>
    <rect x="460" y="55" width="148" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6" opacity=".3"/>
    <text x="534" y="71" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44" opacity=".3">emergency services</text>
    <rect x="460" y="98" width="148" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6" opacity=".3"/>
    <text x="534" y="114" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44" opacity=".3">hospitals</text>
    <rect x="460" y="141" width="148" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6" opacity=".3"/>
    <text x="534" y="157" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44" opacity=".3">food · shelter</text>
    <rect x="460" y="184" width="148" height="32" rx="4" fill="#fff" stroke="#475f6a" stroke-width=".6" opacity=".3"/>
    <text x="534" y="200" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44" opacity=".3">safety</text>
    <text x="320" y="348" text-anchor="middle" font-size="11" fill="#6a8a94">knowledge severs with the network</text>
  </svg>

  <svg class="panel after-panel" id="after" viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>After: accessible design restores the connection</title>
    <defs>
      <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#475f6a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <rect width="640" height="380" fill="#fff"/>
    <text x="320" y="28" text-anchor="middle" font-size="12" fill="#475f6a" letter-spacing="1" font-weight="500">when design holds</text>
    <rect x="30" y="55" width="148" height="32" rx="4" fill="#e3ecee" stroke="#475f6a" stroke-width=".6"/>
    <text x="104" y="71" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">civilians</text>
    <rect x="30" y="98" width="148" height="32" rx="4" fill="#e3ecee" stroke="#475f6a" stroke-width=".6"/>
    <text x="104" y="114" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">displaced people</text>
    <rect x="30" y="141" width="148" height="32" rx="4" fill="#e3ecee" stroke="#475f6a" stroke-width=".6"/>
    <text x="104" y="157" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">aid workers</text>
    <rect x="30" y="184" width="148" height="32" rx="4" fill="#e3ecee" stroke="#475f6a" stroke-width=".6"/>
    <text x="104" y="200" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">community leaders</text>
    <rect x="210" y="55" width="210" height="170" rx="6" fill="#d6e8ec" stroke="#475f6a" stroke-width=".8"/>
    <text x="315" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#303e44">accessible interface</text>
    <text x="315" y="143" text-anchor="middle" font-size="11.5" fill="#475f6a">no instruction needed</text>
    <text x="315" y="160" text-anchor="middle" font-size="11.5" fill="#475f6a">any language · any literacy</text>
    <line x1="180" y1="71" x2="208" y2="100" stroke="#475f6a" stroke-width=".6" marker-end="url(#ay)"/>
    <line x1="180" y1="114" x2="208" y2="118" stroke="#475f6a" stroke-width=".6" marker-end="url(#ay)"/>
    <line x1="180" y1="157" x2="208" y2="140" stroke="#475f6a" stroke-width=".6" marker-end="url(#ay)"/>
    <line x1="180" y1="200" x2="208" y2="162" stroke="#475f6a" stroke-width=".6" marker-end="url(#ay)"/>
    <line x1="422" y1="98" x2="458" y2="71" stroke="#475f6a" stroke-width=".6" marker-end="url(#ay)"/>
    <line x1="422" y1="125" x2="458" y2="114" stroke="#475f6a" stroke-width=".6" marker-end="url(#ay)"/>
    <line x1="422" y1="152" x2="458" y2="157" stroke="#475f6a" stroke-width=".6" marker-end="url(#ay)"/>
    <line x1="422" y1="178" x2="458" y2="200" stroke="#475f6a" stroke-width=".6" marker-end="url(#ay)"/>
    <rect x="460" y="55" width="148" height="32" rx="4" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="534" y="71" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">emergency services</text>
    <rect x="460" y="98" width="148" height="32" rx="4" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="534" y="114" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">hospitals</text>
    <rect x="460" y="141" width="148" height="32" rx="4" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="534" y="157" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">food · shelter</text>
    <rect x="460" y="184" width="148" height="32" rx="4" fill="#d6e8ec" stroke="#475f6a" stroke-width=".6"/>
    <text x="534" y="200" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#303e44">safety</text>
    <text x="320" y="348" text-anchor="middle" font-size="11" fill="#475f6a">simplicity in service of the people being served</text>
  </svg>

  <div class="divider-line" id="divider"></div>
  <div class="handle" id="handle">‹›</div>
</div>
<p class="hint">drag to compare</p>

<script>
  const wrap=document.getElementById('wrap'),after=document.getElementById('after'),divider=document.getElementById('divider'),handle=document.getElementById('handle');
  let dragging=false;
  function setPos(x){const r=wrap.getBoundingClientRect(),p=Math.max(4,Math.min(96,((x-r.left)/r.width)*100));after.style.clipPath='inset(0 '+(100-p)+'% 0 0)';divider.style.left=p+'%';handle.style.left=p+'%';}
  wrap.addEventListener('mousedown',e=>{dragging=true;setPos(e.clientX);});
  window.addEventListener('mousemove',e=>{if(dragging)setPos(e.clientX);});
  window.addEventListener('mouseup',()=>{dragging=false;});
  wrap.addEventListener('touchstart',e=>{dragging=true;setPos(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchmove',e=>{if(dragging)setPos(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchend',()=>{dragging=false;});
</script>
</body>
</html>
